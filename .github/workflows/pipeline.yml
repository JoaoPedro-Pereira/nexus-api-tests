name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # FASE 1: SAST e Build
  # Validam a segurança e a estrutura inicial
  # ==========================================
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Audit Dependencies
        run: npm audit --audit-level=high || true

  build:
    name: Build & Validate Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

  # ==========================================
  # FASE 2: Testes Unitários e Lint
  # Rodam apenas após a aprovação da Fase 1
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [sast, build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  lint-quality:
    name: Code Lint & Quality
    runs-on: ubuntu-latest
    needs: [sast, build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ==========================================
  # FASE 3: Testes de API (E2E)
  # Executa somente se a Fase 2 passar 100%
  # ==========================================
  api-tests:
    name: API E2E Tests (Curl)
    runs-on: ubuntu-latest
    needs: [test, lint-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Start API
        run: npm start &

      - name: Run API Tests (Smoke, Sanity, Regression)
        run: bash scripts/api-tests.sh